<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counter Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
        }
        .counter {
            text-align: center;
            padding: 20px;
            border: 2px solid #ddd;
            border-radius: 8px;
            margin: 20px 0;
        }
        .btn {
            font-size: 18px;
            padding: 10px 20px;
            margin: 0 10px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            background-color: #007bff;
            color: white;
        }
        .btn:hover {
            background-color: #0056b3;
        }
        h2 {
            color: #333;
            margin-bottom: 20px;
        }
        .test-info {
            background-color: #f8f9fa;
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="test-info">
        <h3>Counter Test</h3>
        <p>This tests the counter functionality with the Mini Framework.</p>
        <p>Click the + and - buttons to increment and decrement the counter.</p>
        <p>The counter should update immediately when buttons are clicked.</p>
    </div>
    
    <div id="app"></div>

    <script type="module">
        import MiniFramework from './src/index.js';

        const app = new MiniFramework({
            container: '#app',
            state: { count: 0 },
            autoRerender: true,
            rerenderDelay: 0, // Immediate re-render for testing
            debug: true // Enable debug logging
        });

        app.init();

        function Counter() {
            const count = app.state.get('count');
            console.log("Counter rendered with count:", count);

            return {
                tag: 'div',
                attributes: { class: 'counter' },
                children: [
                    {
                        tag: 'h2',
                        children: [`Count: ${count}`]
                    },
                    {
                        tag: 'button',
                        attributes: {
                            onclick: async () => {
                                console.log('Decrement button clicked, current count:', count);
                                await app.state.set('count', count - 1);
                                console.log('State updated to:', app.state.get('count'));
                            },
                            class: 'btn'
                        },
                        children: ['-']
                    },
                    {
                        tag: 'button',
                        attributes: {
                            onclick: async () => {
                                console.log('Increment button clicked, current count:', count);
                                await app.state.set('count', count + 1);
                                console.log('State updated to:', app.state.get('count'));
                            },
                            class: 'btn'
                        },
                        children: ['+']
                    }
                ]
            };
        }

        // The framework should automatically re-render when state changes
        // because autoRerender is true by default
        app.render(Counter);
        
        console.log('Counter app initialized');
    </script>
</body>
</html>
